
services:
  php:
    build: .
    container_name: php
    ports:
      - "8082:80"
    volumes:
      - ./src:/var/www/html
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: logic_gate
      DB_USERNAME: logic_gate_user
      DB_PASSWORD: logic_gate_password
      APP_ENV: dev
      XP_POR_NIVEL: 100
    depends_on:
      mysql:
        condition: service_healthy
    restart: always

  mysql:
    image: mysql:8.0
    container_name: mysql
    environment:
      MYSQL_DATABASE: logic_gate
      MYSQL_USER: logic_gate_user
      MYSQL_PASSWORD: logic_gate_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test:
        - CMD
        - mysqladmin
        - ping
        - -h
        - localhost
        - -u
        - root
        - -proot_password
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: always

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: phpmyadmin
    ports:
      - "8081:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
    depends_on:
      mysql:
        condition: service_healthy
    restart: always

volumes:
  mysql_data: